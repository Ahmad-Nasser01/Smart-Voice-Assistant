<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الذكي الصوتي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 420px;
            height: 650px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        .chat-header {
            padding: 20px;
            background: rgba(15, 23, 42, 0.8);
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }
        .chat-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: #f8fafc;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }
        .message {
            padding: 12px 16px;
            border-radius: 14px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .bot-message {
            background-color: #334155;
            color: #f1f5f9;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .user-message {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .error-message {
            background-color: #ef4444;
            color: white;
            align-self: center;
            text-align: center;
            font-size: 13px;
        }
        
        /* تنسيق مؤشر جاري التفكير */
        .typing-indicator {
            display: none; /* مخفي افتراضياً */
            gap: 4px;
            padding: 12px 16px;
            background-color: #334155;
            border-radius: 14px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
            width: fit-content;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background-color: #94a3b8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .input-area {
            padding: 20px;
            background: rgba(15, 23, 42, 0.8);
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: #0f172a;
            color: white;
            outline: none;
            font-size: 14px;
            transition: all 0.3s;
        }
        .input-area input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        .btn {
            background: #3b82f6;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 15px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #2563eb;
            transform: scale(1.05);
        }
        
        /* تنسيق زر الإيقاف */
        .btn-stop {
            background: #ef4444;
        }
        .btn-stop:hover {
            background: #dc2626;
        }

        .listening {
            background: #ef4444 !important;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="status-dot"></div>
        <h2>المساعد الذكي (عربي / إنجليزي)</h2>
    </div>
    
    <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">
            أهلاً بك! اضغط على زر اللغة لتغيير لغة المايكروفون ثم تحدث 🎤🌐
        </div>
        
        <!-- عنصر مؤشر التفكير جاهز ومخفي -->
        <div class="typing-indicator" id="typingIndicator">
            <span></span><span></span><span></span>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="textInput" placeholder="اكتب رسالتك أو اسألني..." onkeypress="handleKeyPress(event)">
        
        <!-- زر الإيقاف الفوري للصوت -->
        <button id="stopBtn" class="btn btn-stop" title="إيقاف الصوت الفوري">🛑</button>
        
        <button id="langBtn" class="btn" title="تغيير لغة المايكروفون">AR</button>
        <button id="micButton" class="btn" title="تحدث">🎤</button>
    </div>
</div>

<script>
    const chatMessages = document.getElementById('chatMessages');
    const textInput = document.getElementById('textInput');
    const micButton = document.getElementById('micButton');
    const langBtn = document.getElementById('langBtn');
    const stopBtn = document.getElementById('stopBtn');
    const typingIndicator = document.getElementById('typingIndicator');

    let currentLang = 'ar-SA';

    // برمجة زر إيقاف الصوت
    stopBtn.addEventListener('click', () => {
        window.speechSynthesis.cancel();
    });

    function addMessage(text, sender) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message');
        if (sender === 'user') {
            messageDiv.classList.add('user-message');
        } else if (sender === 'error') {
            messageDiv.classList.add('error-message');
        } else {
            messageDiv.classList.add('bot-message');
        }
        messageDiv.textContent = text;
        
        // التأكد من أن مؤشر التفكير دائماً في الأسفل إذا كان ظاهراً
        chatMessages.insertBefore(messageDiv, typingIndicator);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === "Enter" && textInput.value.trim() !== "") {
            const text = textInput.value;
            addMessage(text, 'user');
            textInput.value = '';
            sendToBackend(text);
        }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = currentLang;
        recognition.interimResults = false;

        langBtn.addEventListener('click', () => {
            if (currentLang === 'ar-SA') {
                currentLang = 'en-US';
                recognition.lang = 'en-US';
                langBtn.textContent = 'EN';
                langBtn.style.background = '#8b5cf6';
            } else {
                currentLang = 'ar-SA';
                recognition.lang = 'ar-SA';
                langBtn.textContent = 'AR';
                langBtn.style.background = '#3b82f6';
            }
        });

        micButton.addEventListener('click', () => {
            try {
                // إيقاف أي صوت سابق تلقائياً عند بدء تسجيل جديد
                window.speechSynthesis.cancel();
                
                recognition.lang = currentLang;
                recognition.start();
                micButton.classList.add('listening');
            } catch (error) {
                console.error(error);
            }
        });

        recognition.onresult = (event) => {
            const speechText = event.results[0][0].transcript;
            micButton.classList.remove('listening');
            
            addMessage(speechText, 'user');
            sendToBackend(speechText);
        };

        recognition.onerror = () => {
            micButton.classList.remove('listening');
        };

        recognition.onend = () => {
            micButton.classList.remove('listening');
        };
    } else {
        micButton.title = "المتصفح لا يدعم المايكروفون";
    }

    async function sendToBackend(text) {
        // إظهار مؤشر التفكير وتحريكه لأسفل القائمة
        chatMessages.appendChild(typingIndicator);
        typingIndicator.style.display = 'flex';
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
            const response = await fetch('http://127.0.0.1:5000/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const data = await response.json();
            
            // إخفاء مؤشر التفكير عند وصول الرد
            typingIndicator.style.display = 'none';
            
            if (data.status === 'success') {
                addMessage(data.reply, 'bot');
                speakText(data.reply);
            } else {
                addMessage(data.message, 'error');
            }
        } catch (err) {
            // إخفاء مؤشر التفكير عند حدوث خطأ
            typingIndicator.style.display = 'none';
            addMessage('حدث خطأ أثناء الاتصال بالخادم.', 'error');
        }
    }

    function speakText(text) {
        // نوقف أي صوت سابق قبل البدء بنطق الرد الجديد
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = /[a-zA-Z]/.test(text) ? 'en-US' : 'ar-SA';
        window.speechSynthesis.speak(utterance);
    }
</script>

</body>
</html>
